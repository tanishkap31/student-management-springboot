spring.application.name=student-management

# MySQL connection (password is read from the DB_PASSWORD environment variable)
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates/updates the students table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Show error messages (e.g. "Student not found") in API error responses
server.error.include-message=always
